<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370">
<title>01-shaper-and-link — clarified schematic diagram</title>
<desc>Qualitative redraw of the student's original diagram. Positions are graphical coordinates, not measured numerical data.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.3"/></marker>
<pattern id="orange" width="17" height="17" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0 V17" stroke="#ff7829" stroke-width="3"/></pattern>
<pattern id="purple" width="19" height="19" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><path d="M0 0 V19" stroke="#c548e8" stroke-width="3"/></pattern>
<pattern id="grey" width="25" height="25" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0 V25" stroke="#8a8a8a" stroke-width="2"/></pattern>
</defs><rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="24" fill="#171717" stroke-linecap="round" stroke-linejoin="round">
<text x="45" y="35" font-size="25" fill="#171717" text-anchor="start">Token bucket shaper and output link</text>
<rect x="70" y="193" width="165" height="78" fill="#f5f8fc" stroke="#ff7829" stroke-width="2"/>
<text x="152.5" y="224" font-size="21" fill="#171717" text-anchor="middle">Input buffer</text>
<text x="152.5" y="252" font-size="19" fill="#171717" text-anchor="middle">B<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
<rect x="320" y="193" width="160" height="78" fill="#f5f8fc" stroke="#2463a7" stroke-width="2"/>
<text x="400.0" y="224" font-size="21" fill="#171717" text-anchor="middle">Shaper</text>
<text x="400.0" y="252" font-size="19" fill="#171717" text-anchor="middle"></text>
<rect x="570" y="193" width="170" height="78" fill="#f5f8fc" stroke="#ff7829" stroke-width="2"/>
<text x="655.0" y="224" font-size="21" fill="#171717" text-anchor="middle">Output buffer</text>
<text x="655.0" y="252" font-size="19" fill="#171717" text-anchor="middle">B<tspan baseline-shift="sub" font-size="70%">o</tspan></text>
<rect x="835" y="193" width="170" height="78" fill="#f5f8fc" stroke="#2463a7" stroke-width="2"/>
<text x="920.0" y="224" font-size="21" fill="#171717" text-anchor="middle">Link</text>
<text x="920.0" y="252" font-size="19" fill="#171717" text-anchor="middle">capacity c</text>
<path d="M235 232 L310 232" fill="none" stroke="#2463a7" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M480 232 L560 232" fill="none" stroke="#2463a7" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M740 232 L825 232" fill="none" stroke="#2463a7" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1005 232 L1075 232" fill="none" stroke="#2463a7" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="24" y="178" font-size="20" fill="#171717" text-anchor="start">G(t)</text>
<path d="M24 232 L60 232" fill="none" stroke="#ed39d5" stroke-width="3" marker-end="url(#arrow)"/>
<text x="520" y="208" font-size="21" fill="#2463a7" text-anchor="middle">λ<tspan baseline-shift="sub" font-size="70%">out</tspan></text>
<text x="1061" y="208" font-size="21" fill="#2463a7" text-anchor="middle">λ<tspan baseline-shift="sub" font-size="70%">f</tspan></text>
<path d="M335 89 L345 137 H455 L465 89" fill="none" stroke="#2463a7" stroke-width="2.5"/>
<circle cx="359" cy="121" r="5" fill="#228971"/>
<circle cx="382" cy="121" r="5" fill="#228971"/>
<circle cx="405" cy="121" r="5" fill="#228971"/>
<circle cx="428" cy="121" r="5" fill="#228971"/>
<path d="M400 57 L400 87" fill="none" stroke="#228971" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="428" y="77" font-size="21" fill="#228971" text-anchor="start">ρ = λ</text>
<path d="M400 140 L400 183" fill="none" stroke="#228971" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="503" y="125" font-size="22" fill="#171717" text-anchor="start">b = (λ<tspan baseline-shift="sub" font-size="70%">p</tspan> − ρ)T<tspan baseline-shift="sub" font-size="70%">b</tspan></text>
<text x="152" y="322" font-size="20" fill="#171717" text-anchor="middle">B<tspan baseline-shift="sub" font-size="70%">i</tspan> = (λ<tspan baseline-shift="sub" font-size="70%">p</tspan> − ρ)T<tspan baseline-shift="sub" font-size="70%">g</tspan></text>
<text x="710" y="322" font-size="20" fill="#171717" text-anchor="middle">B<tspan baseline-shift="sub" font-size="70%">o</tspan> = (λ<tspan baseline-shift="sub" font-size="70%">p</tspan> − c)T<tspan baseline-shift="sub" font-size="70%">b</tspan></text>
<text x="710" y="349" font-size="17" fill="#8693a3" text-anchor="middle">for ρ &lt; c &lt; λ<tspan baseline-shift="sub" font-size="70%">p</tspan></text>
</g></svg>
